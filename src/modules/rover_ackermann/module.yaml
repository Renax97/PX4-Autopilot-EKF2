module_name: Rover Ackermann

parameters:
  - group: Rover Ackermann
    definitions:
      RA_WHEEL_BASE:
        description:
          short: Wheel base
          long: Distance from the front to the rear axle.
        type: float
        unit: m
        min: -1
        max: 100
        increment: 0.001
        decimal: 3
        default: -1

      RA_MAX_STR_ANG:
        description:
          short: Maximum steering angle
          long: The maximum angle that the rover can steer
        type: float
        unit: rad
        min: 0.1
        max: 1.5708
        increment: 0.01
        decimal: 2
        default: 0.5236

      RA_MAX_STR_RATE:
        description:
          short: Maximum steering rate for the rover
        type: float
        unit: deg/s
        min: -1
        max: 1000
        increment: 0.01
        decimal: 2
        default: -1
